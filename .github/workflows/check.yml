name: Check (uv, ruff)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          pip install pipx
          pipx install uv
      - name: Install dependencies with uv
        run: |
          uv sync --all-extras
      - name: Run tests
        run: |
          uv run pytest
      - name: Run ruff
        run: uv run ruff check tritcask/ tests/
